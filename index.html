  const PREVIEW_TOOLBAR = [['copy', 'selectAll']];

  class FormatToolbar {
    constructor(el, editor) {
      this.el = el;
      this.editor = editor;
      this._raf = 0;
      el.addEventListener('mousedown', (e) => {
        // Keep the editor's selection when clicking toolbar buttons.
        if (e.target.closest('button.tb-btn')) e.preventDefault();
      });
      for (const ev of ['formatchange', 'modechange']) editor.addEventListener(ev, () => this.render());
      for (const ev of ['selectionchange', 'change']) editor.addEventListener(ev, () => this.scheduleRefresh());
      this.render();
    }

    render() {
      const ed = this.editor;
      const adapter = ed.adapter;
      const groups = ed.getMode() === 'preview' ? PREVIEW_TOOLBAR : adapter.toolbar;
      this.el.textContent = '';
      let first = true;
      for (const group of groups) {
        const ids = group.filter((id) => ed.supports(id));
        if (!ids.length) continue;
        if (!first) this.el.insertAdjacentHTML('beforeend', '<div class="tb-sep"></div>');
        first = false;
        const g = document.createElement('div');
        g.className = 'tb-group';
        for (const id of ids) g.appendChild(this._item(id, adapter));
        this.el.appendChild(g);
      }
      if (ed.getMode() === 'preview') {
        this.el.insertAdjacentHTML('beforeend', '<span class="tb-hint">Preview is read-only. Switch to Edit or Preview/Edit to change the document.</span>');
      }
      this.refresh();
    }

    _item(id, adapter) {
      const meta = TOOLBAR_ITEMS[id];
      if (meta.kind === 'select') {
        const sel = document.createElement('select');
        sel.className = 'tb-select';
        sel.dataset.item = id;
        sel.title = meta.label;
        sel.setAttribute('aria-label', meta.label);
        for (const [value, label] of adapter.blockOptions) sel.add(new Option(label, value));
        sel.addEventListener('change', () => this.editor.exec('block', sel.value));
        return sel;
      }
      if (meta.kind === 'color') {
        const label = document.createElement('label');
        label.className = 'tb-btn tb-color';
        label.title = meta.label;
        label.innerHTML = meta.html;
        const input = document.createElement('input');
        input.type = 'color';
        input.value = meta.initial;
        input.setAttribute('aria-label', meta.label);
        label.querySelector('.swatch').style.background = meta.initial;
        input.addEventListener('input', () => { label.querySelector('.swatch').style.background = input.value; });
        input.addEventListener('change', () => this.editor.exec(id, input.value));
        label.appendChild(input);
        return label;
      }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tb-btn';
      btn.dataset.item = id;
      btn.title = meta.label;
      btn.setAttribute('aria-label', meta.label);
      if (meta.kind === 'toggle') btn.setAttribute('aria-pressed', 'false');
      btn.innerHTML = meta.html;
      btn.addEventListener('click', () => this.editor.exec(id));
      return btn;
    }

    scheduleRefresh() {
      cancelAnimationFrame(this._raf);
      this._raf = requestAnimationFrame(() => this.refresh());
    }

    refresh() {
      this.el.querySelectorAll('[aria-pressed]').forEach((btn) => {
        btn.setAttribute('aria-pressed', this.editor.queryState(btn.dataset.item) ? 'true' : 'false');
      });
      const block = this.el.querySelector('select[data-item="block"]');
      const state = this.editor.queryState('block');
      if (block && state && Array.from(block.options).some((o) => o.value === state)) block.value = state;
    }
  }

  /* ==========================================================================
     9. SaveFolder
     The save folder is whatever the user picks. Browsers never expose a
     folder's absolute path, so we persist:
       - the FileSystemDirectoryHandle in IndexedDB (Chromium, all OSes), and
       - its display name in localStorage (every browser).
     Browsers without showDirectoryPicker (Firefox, Safari) fall back to
     downloading the file.
     ========================================================================== */
  class SaveFolder {
    constructor({ onChange } = {}) {
      this.supported = 'showDirectoryPicker' in window;
      this.handle = null;
      this.name = safeStorage.get(LS_FOLDER_NAME) || '';
      this.onChange = onChange || (() => {});
    }

    async init() {
      if (this.supported) {
        try { this.handle = (await idbGet(IDB_FOLDER_KEY)) || null; } catch { this.handle = null; }
        if (this.handle) this.name = this.handle.name;
        else this.name = '';
      }
      this.onChange(this);
    }

    get label() {
      if (!this.supported) return 'Browser downloads';
      return this.name ? `${this.name}/` : 'Choose save folder…';
    }

    /** Opens the folder picker. Returns the handle, or null if cancelled. */
    async pick() {
      if (!this.supported) return null;
      try {
        const opts = { id: 'ctf-save-folder', mode: 'readwrite' };
        if (this.handle) opts.startIn = this.handle;
        const picked = await window.showDirectoryPicker(opts);
        this.handle = picked;
        this.name = picked.name;
        await idbSet(IDB_FOLDER_KEY, picked).catch(() => {});
        safeStorage.set(LS_FOLDER_NAME, picked.name);
        this.onChange(this);
        return picked;
      } catch (err) {
        if (err && err.name === 'AbortError') return null;
        throw err;
      }
    }

    /** Returns a handle with readwrite permission, asking the user if needed. */
    async getWritableHandle() {
      if (!this.handle) return this.pick();
      const opts = { mode: 'readwrite' };
      if ((await this.handle.queryPermission(opts)) === 'granted') return this.handle;
      if ((await this.handle.requestPermission(opts)) === 'granted') return this.handle;
      return null;
    }
  }

  /* ==========================================================================
     10. APP SHELL
     Wires the editor, toolbar, doc bar, dialogs and save/new together.
     ========================================================================== */
  const titleInput = $('docTitle');
  const formatSelect = $('formatSelect');
  const btnSave = $('btnSave');
  const folderLink = $('folderLink');

  let dirty = false;
  let saving = false;
  let lastSavedName = '';
  let titleBeforeFocus = DEFAULT_TITLE;

  /* ---- Dialogs + toast ---- */
  const dialog = $('dialog');

  function openDialog({ title, message, okLabel = 'OK', danger = false, input = null }) {
    return new Promise((resolve) => {
      $('dlgTitle').textContent = title;
      $('dlgMsg').innerHTML = message;
      const ok = $('dlgOk');
      ok.textContent = okLabel;
      ok.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
      const field = $('dlgInput');
      field.hidden = input === null;
      field.value = input ?? '';
      dialog.returnValue = 'cancel';
      dialog.addEventListener('close', () => {
        const confirmed = dialog.returnValue === 'ok';
        resolve(input === null ? confirmed : (confirmed ? field.value.trim() : null));
      }, { once: true });
      dialog.showModal();
      if (input !== null) { field.focus(); field.select(); } else { ok.focus(); }
    });
  }
  const confirmDialog = (title, message, okLabel, danger = false) => openDialog({ title, message, okLabel, danger });
  const promptDialog = (title, message, initial = '') => openDialog({ title, message: escapeHtml(message), okLabel: 'Insert', input: initial });

  let toastTimer;
  function toast(message, isError = false) {
    const t = $('toast');
    $('toastMsg').innerHTML = message;
    t.classList.toggle('error', isError);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), isError ? 5000 : 3000);
  }

  /* ---- Editor + toolbar ---- */
  const editor = new FragEditor($('editorHost'), { format: DEFAULT_FORMAT, mode: DEFAULT_MODE, prompt: promptDialog });
  new FormatToolbar($('toolbar'), editor);

  for (const f of Object.values(FORMATS)) formatSelect.add(new Option(f.label, f.id));

  /* ---- Doc bar: dirty state, word count, format, mode ---- */
  function setDirty(value) {
    dirty = value;
    $('saveDot').classList.toggle('dirty', dirty);
    $('saveState').textContent = dirty ? 'Unsaved changes' : (lastSavedName ? `Saved as ${lastSavedName}` : 'No changes');
  }

  function updateMeta() {
    const { words } = editor.stats();
    $('wordCount').textContent = `${words} word${words === 1 ? '' : 's'}`;
  }

  function syncFormatUi() {
    const a = editor.adapter;
    formatSelect.value = a.id;
    $('extChip').textContent = a.ext;
    $('extChip').title = `The ${a.ext} extension is added automatically.`;
  }

  function syncModeUi() {
    document.querySelectorAll('#modeSwitch [data-mode]').forEach((b) => {
      b.setAttribute('aria-checked', b.dataset.mode === editor.getMode() ? 'true' : 'false');
    });
  }

  editor.addEventListener('change', () => { setDirty(true); updateMeta(); });
  editor.addEventListener('formatchange', syncFormatUi);
  editor.addEventListener('modechange', syncModeUi);
  editor.addEventListener('notify', (e) => toast(e.detail.message));

  formatSelect.addEventListener('change', async () => {
    const from = editor.getFormat();
    const to = formatSelect.value;
    if (editor.setFormat(to)) return;
    const keep = await confirmDialog(
      'Conversion not available yet',
      `Converting <strong>${escapeHtml(FORMATS[from].label)}</strong> to <strong>${escapeHtml(FORMATS[to].label)}</strong> isn't implemented yet. Keep the content as-is and treat it as ${escapeHtml(FORMATS[to].label)}?`,
      'Keep as-is'
    );
    if (keep) editor.setFormat(to, { convert: false });
    else formatSelect.value = from;
  });

  document.querySelectorAll('#modeSwitch [data-mode]').forEach((b) => {
    b.addEventListener('click', () => editor.setMode(b.dataset.mode));
  });

  /* ---- Title textbox ---- */
  const INVALID_CHARS = /[\\/:*?"<>|\u0000-\u001f]/g;

  function cleanTitle(value) {
    return value
      .replace(INVALID_CHARS, '')
      .trim()
      .replace(/\.(md|markdown|html?|txt)$/i, '')
      .replace(/[. ]+$/, '')
      .trim();
  }
  const currentTitle = () => cleanTitle(titleInput.value) || titleBeforeFocus || DEFAULT_TITLE;
  const fileName = () => `${currentTitle()}${editor.adapter.ext}`;

  titleInput.addEventListener('focus', () => {
    titleBeforeFocus = cleanTitle(titleInput.value) || titleBeforeFocus || DEFAULT_TITLE;
    titleInput.select();
  });
  titleInput.addEventListener('input', () => {
    if (INVALID_CHARS.test(titleInput.value)) {
      const pos = titleInput.selectionStart;
      const before = titleInput.value.length;
      titleInput.value = titleInput.value.replace(INVALID_CHARS, '');
      const p = Math.max(0, pos - (before - titleInput.value.length));
      titleInput.setSelectionRange(p, p);
    }
    INVALID_CHARS.lastIndex = 0;
  });
  titleInput.addEventListener('blur', () => {
    const value = cleanTitle(titleInput.value);
    titleInput.value = value || titleBeforeFocus;
    if (value && value !== titleBeforeFocus) setDirty(true);
    titleBeforeFocus = titleInput.value;
  });
  titleInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); editor.focus(); }
    if (e.key === 'Escape') { e.preventDefault(); titleInput.value = titleBeforeFocus; editor.focus(); }
  });

  /* ---- Save folder (request 1) ---- */
  const folder = new SaveFolder({
    onChange: (f) => {
      $('folderName').textContent = f.label;
      folderLink.disabled = !f.supported;
      folderLink.title = f.supported
        ? `${f.name ? `Saving to “${f.name}”. ` : ''}Click to choose a different save folder. (Browsers only reveal a folder's name, not its full path.)`
        : "This browser can't pick folders, so files download to your browser's downloads folder.";
    },
  });
  if (!folder.supported) $('unsupported').classList.add('show');
  folderLink.addEventListener('click', async () => {
    try {
      const picked = await folder.pick();
      if (picked) toast(`Saving to <code>${escapeHtml(picked.name)}/</code>`);
    } catch (err) {
      toast(`Couldn't open folder: ${escapeHtml(err.message || String(err))}`, true);
    }
  });

  /* ---- Save / New ---- */
  function downloadFile(name, content, mime) {
    const url = URL.createObjectURL(new Blob([content], { type: `${mime};charset=utf-8` }));
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function save() {
    if (saving) return;
    if (document.activeElement === titleInput) titleInput.blur();
    saving = true;
    btnSave.disabled = true;
    try {
      const adapter = editor.adapter;
      const name = fileName();
      const content = adapter.fileContent(editor.getContent(), currentTitle());

      if (!folder.supported) {
        downloadFile(name, content, adapter.mime);
        lastSavedName = name;
        setDirty(false);
        toast(`Downloaded <code>${escapeHtml(name)}</code>`);
        return;
      }

      const dir = await folder.getWritableHandle();
      if (!dir) { toast('Saving needs permission to edit the save folder.', true); return; }

      let exists = false;
      try { await dir.getFileHandle(name); exists = true; } catch (err) { if (err.name !== 'NotFoundError') throw err; }
      if (exists) {
        const overwrite = await confirmDialog(
          'Replace existing document?',
          `<code>${escapeHtml(name)}</code> already exists in <code>${escapeHtml(dir.name)}/</code>. Do you want to overwrite it?`,
          'Overwrite',
          true
        );
        if (!overwrite) return;
      }

      const file = await dir.getFileHandle(name, { create: true });
      const writable = await file.createWritable();
      await writable.write(content);
      await writable.close();

      lastSavedName = name;
      setDirty(false);
      toast(`Saved <code>${escapeHtml(dir.name)}/${escapeHtml(name)}</code>`);
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      console.error(err);
      toast(`Couldn't save: ${escapeHtml(err && err.message ? err.message : String(err))}`, true);
    } finally {
      saving = false;
      btnSave.disabled = false;
    }
  }

  async function newDocument() {
    if (dirty) {
      const discard = await confirmDialog('Discard changes?', 'This document has unsaved changes. Start a new document and discard them?', 'Discard', true);
      if (!discard) return;
    }
    editor.clear();
    titleInput.value = DEFAULT_TITLE;
    titleBeforeFocus = DEFAULT_TITLE;
    lastSavedName = '';
    syncFormatUi();
    setDirty(false);
    updateMeta();
    editor.focus();
  }

  btnSave.addEventListener('click', save);
  $('btnNew').addEventListener('click', newDocument);

  /* ---- Keyboard shortcuts ---- */
  document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && !e.altKey && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    if (mod && e.altKey && ['Digit1', 'Digit2', 'Digit3'].includes(e.code)) {
      e.preventDefault();
      editor.setMode(MODES[Number(e.code.slice(-1)) - 1]);
    }
  });

  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // Keep the sticky toolbar right under the app bar.
  const setAppbarHeight = () => document.documentElement.style.setProperty('--appbar-h', `${$('appbar').offsetHeight}px`);
  window.addEventListener('resize', setAppbarHeight);
  setAppbarHeight();

  /* ---- Debug / test hooks ---- */
  window.captureTheFrag = {
    editor,
    FORMATS,
    FormatConverter,
    detectFormat,
    markdownToHtml,
    htmlToMarkdown,
    sanitizeHtml,
    normalizeGoogleDocsHtml,
    toMarkdown: () => FormatConverter.convert(editor.getContent(), editor.getFormat(), 'markdown') ?? editor.getContent(),
  };

  /* ---- Boot ---- */
  syncFormatUi();
  syncModeUi();
  updateMeta();
  setDirty(false);
  folder.init();
})();
</script>
</body>
</html>
